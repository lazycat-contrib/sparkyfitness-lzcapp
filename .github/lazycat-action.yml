version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: sparkyfitness
build:
  toolchains: []
  run_buildscript: false
images:
  - id: sparkyfitness
    target: service
    service: frontend
    source: codewithcj/sparkyfitness
    channel: stable
    sort: semver
    # Tags carry a "v" prefix (v1.11.0) alongside latest/dev, so the optional v
    # is required and all three numeric segments are mandatory.
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: SparkyFitness
    skip_if_version_exists: true
